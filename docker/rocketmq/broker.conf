# RocketMQ broker 本地开发配置。
# 默认情况下 broker 会把「容器内网 IP」注册到 name server，宿主机上的应用
# （mvn spring-boot:run 起在宿主）拿到该地址后无法回连，发送消息会
# "sendDefaultImpl call timeout"。这里显式指定 brokerIP1=127.0.0.1，
# 宿主机通过 compose 映射出来的 10911 端口即可回连 broker。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
# 首次发送时自动创建 topic（VIDEO_PROCESS），免去手工建 topic
autoCreateTopicEnable = true
deleteWhen = 04
fileReservedTime = 48