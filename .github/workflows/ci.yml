name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 现有测试全是纯单元测试（无 @SpringBootTest / @Autowired），
      # 故不需要 Postgres / Redis / MinIO 服务容器；将来加了集成测试再补 services 段。
      - name: 运行测试
        run: mvn -B -ntp test

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 构建
        working-directory: frontend
        run: npm run build